name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e '.[dev]'

      - name: Run tests (unit + git differential parity)
        run: pytest -v

      - name: CLI smoke test
        shell: bash
        run: |
          python -m ignordr --version
          python -m ignordr --help
          python -m ignordr --color never explain --help

      - name: Read-only guarantee
        shell: bash
        run: |
          set -eu
          before=$(find . -type f -not -path './.git/*' -not -path '*/__pycache__/*' -not -path './.pytest_cache/*' | sort | md5sum)
          ignordr audit --repo . || true
          ignordr lint --repo . || true
          ignordr scan --repo . || true
          ignordr fix --repo . || true
          after=$(find . -type f -not -path './.git/*' -not -path '*/__pycache__/*' -not -path './.pytest_cache/*' | sort | md5sum)
          test "$before" = "$after"
