<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="ignordr">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <!-- rounded app tile -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="url(#bg)" stroke="url(#glow)" stroke-width="2"/>
  <!-- the dot of .gitignore -->
  <circle cx="30" cy="64" r="7" fill="#94a3b8"/>
  <!-- the file -->
  <path d="M46 28 h34 l18 18 v54 a8 8 0 0 1-8 8 H46 a8 8 0 0 1-8-8 V36 a8 8 0 0 1 8-8 z"
        fill="#0b1220" stroke="#475569" stroke-width="3" stroke-linejoin="round"/>
  <path d="M80 28 v18 h18" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round"/>
  <!-- ruled lines -->
  <line x1="46" y1="66" x2="76" y2="66" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <line x1="46" y1="80" x2="84" y2="80" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <line x1="46" y1="94" x2="66" y2="94" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <!-- the magnifier tracing a rule -->
  <circle cx="86" cy="86" r="17" fill="none" stroke="url(#glow)" stroke-width="6"/>
  <line x1="98" y1="98" x2="112" y2="112" stroke="url(#glow)" stroke-width="7" stroke-linecap="round"/>
</svg>
